# Rogue DNS resolver for Threat 3 (DNS hijacking).
# Resolves the target's name to the attacker's clone site instead of the real
# IP. __CLONE_IP__ is substituted by run-dns.sh.
#
# Deployed on the attacker container; the victim is pointed at it by editing
# /etc/resolv.conf (the weak point the attack exploits).

# The hijack: the "bank" name resolves to the phishing clone.
address=/bank-lab.example/__CLONE_IP__

# A lookalike the protective resolver should merely warn on.
address=/secure-bank-login.example/__CLONE_IP__

# Everything else is answered from this static map so the rogue resolver works
# with the lab offline; a real rogue resolver would forward these upstream to
# stay believable.
address=/bank-legit.example/10.255.255.50
address=/ssle-portal.example/10.255.255.51

# Bind only the container's LAN interface, not the loopback stub that
# systemd-resolved already occupies (127.0.0.53:53); otherwise dnsmasq fails
# with "address already in use" on 0.0.0.0:53.
interface=eth0
except-interface=lo
bind-interfaces
no-resolv
log-queries
