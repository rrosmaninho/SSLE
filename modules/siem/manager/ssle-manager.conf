<!--
  Manager-side configuration fragment: the command and active-response
  definitions that give each threat an action-response.

  Appended to /var/ossec/etc/ossec.conf inside <ossec_config>.

  Threat 1 (DoS)  -> firewall-drop on the flooding source, 10 minutes.
  Threat 2 (C2)   -> ssle-isolate: block the C2 address, deregister the
                     service from the architecture, snapshot for forensics.
  Threat 3 (DNS)  -> the protective resolver sinkholes the domain itself
                     (the response is in the data path); the SIEM alerts
                     and, on a repeated campaign, drops the rogue resolver.
-->
<ossec_config>

  <!-- ---------- commands ---------- -->
  <command>
    <name>ssle-isolate</name>
    <executable>ssle-isolate</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- ---------- THREAT 1: DoS ---------- -->
  <!-- Wired to rule 100102 (sustained flood) rather than 100101 (first
       detection). Blocking on the first threshold crossing would make a
       legitimate traffic spike enough to cut a client off; requiring the
       sustained pattern trades a little detection delay for far fewer
       false positives. -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100102</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- ---------- THREAT 2: C2 ---------- -->
  <!-- Wired to 100213 (reverse-shell signature). The response isolates the
       host from the architecture rather than killing the process, so the
       compromised container stays available for the post-mortem. -->
  <active-response>
    <command>ssle-isolate</command>
    <location>local</location>
    <rules_id>100213</rules_id>
    <timeout>1800</timeout>
  </active-response>

  <!-- ---------- THREAT 3: DNS hijacking ---------- -->
  <!-- A single sinkholed lookup is handled in the data path by the
       resolver. This responds to a campaign: repeated hijack attempts
       against one client (rule 100303). -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100303</rules_id>
    <timeout>600</timeout>
  </active-response>

</ossec_config>
