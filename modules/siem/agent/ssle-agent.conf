<!--
  Agent-side configuration fragment for SSLE service containers.
  Appended to /var/ossec/etc/ossec.conf inside <ossec_config>.

  Three collection paths, one per threat:
    - access logs in Common Log Format  -> threat 1 (DoS frequency rules)
    - file integrity on binaries/config -> threat 2 (implant, persistence)
    - outbound connection reporting     -> threat 2 (C2 channel)
  Threat 3 is collected on the resolver host, which has its own fragment.
-->
<ossec_config>

  <!-- Service access logs. The services emit Common Log Format precisely so
       Wazuh's built-in web-accesslog decoder parses them with no custom
       decoder. -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/ssle/*-access.log</location>
  </localfile>

  <!-- Incident-response actions taken on this host, so the post-mortem has
       a record even if the manager is unreachable. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ssle/incident-response.log</location>
  </localfile>

  <!-- Outbound connections, for C2 detection. The ssle-netwatch script is
       run by a systemd timer (ssle-netwatch.timer, every 15s) which appends
       to this log; the agent tails the file. This file path is used rather
       than Wazuh's own <command> log_format because agent-side command
       execution did not reliably deliver output for analysis, whereas file
       tailing (the same path the access logs use) is dependable. Each line
       is one connection, decoded individually by the ssle-netwatch decoder. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ssle/netwatch.log</location>
  </localfile>

  <!-- File integrity monitoring.
       realtime on the service binary directory: an implant should be
       noticed when it lands, not at the next scheduled scan. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/ssle</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/ssle</directories>

    <!-- Persistence mechanisms: nothing in this architecture creates these
         at runtime, so any change is worth an alert. -->
    <directories check_all="yes" realtime="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly</directories>
    <directories check_all="yes" realtime="yes">/var/spool/cron/crontabs</directories>
    <directories check_all="yes" realtime="yes">/etc/systemd/system</directories>

    <!-- Noise control: the services' own data and logs change constantly. -->
    <ignore>/var/lib/ssle</ignore>
    <ignore>/var/log/ssle</ignore>
    <ignore type="sregex">\.log$|\.db$|\.db-wal$|\.db-shm$</ignore>
  </syscheck>

  <!-- Rootkit and persistence checks. -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>600</frequency>
  </rootcheck>

</ossec_config>
